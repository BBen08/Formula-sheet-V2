# publish.yml - GitHub builds and publishes Formula Finder V2 on every push.
#
# What happens on GitHub after `git push` (see the "Actions" tab of the repo):
#   1. run the tests  -> if one fails, nothing is published
#   2. run src/main.py to build web/ (the app WITHOUT formulas: those are only
#      in the Supabase database, uploaded from the laptop with upload_cards.py)
#   3. a last check that no formulas or secret keys are in web/
#   4. publish web/ on GitHub Pages: https://bben08.github.io/Formula-Finder/
name: Publish V2

on:
  push:
    branches: [main]
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build app
        run: python src/main.py
      - name: Check that no formulas or secret keys are published
        run: |
          if [ -e web/publish.html ] || grep -rl "FORMULA_DATA" web/index.html; then
            echo "Formulas found in web/. Not publishing."; exit 1
          fi
          if grep -rlE "sb_secret_[A-Za-z0-9_-]{16,}" web/; then
            echo "A secret key was found in web/. Not publishing."; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
